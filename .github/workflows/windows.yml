name: windows

# The Windows half of a release, and the only definition of it: release.yml
# calls this rather than restating the steps, so the two cannot drift.
# `workflow_dispatch` runs it alone, which is how it gets brought up without
# cutting a release.
#
# No container here: the glibc problem that forces the Linux build into
# AlmaLinux 8 does not exist on Windows, so this builds natively on the runner.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: dev
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # download-deps.sh calls cl and lib, which are not on PATH until vcvars
      # has run. vswhere finds the install; the edition differs between runner
      # images, so it must not be hardcoded.
      - name: MSVC environment
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          )
          set >> "%GITHUB_ENV%"

      # glslc comes from the Vulkan SDK. choco installs it and then says the
      # shell has to be reopened before PATH catches up, which a job step never
      # does — so the install directory goes on GITHUB_PATH by hand. The version
      # is part of the path, so it is found rather than hardcoded.
      - name: Install the Vulkan SDK
        run: |
          choco install vulkan-sdk -y --no-progress
          sdk=$(ls -d /c/VulkanSDK/*/ | sort -V | tail -1)
          echo "found $sdk"
          ls "${sdk}Bin/glslc.exe"
          cygpath -w "${sdk}Bin" >> "$GITHUB_PATH"

      - name: Odin
        run: |
          curl -fsSL -o odin.zip \
            "https://github.com/odin-lang/Odin/releases/download/dev-2026-08/odin-windows-amd64-dev-2026-08.zip"
          7z x odin.zip -oodin-dist > /dev/null
          # The zip's top-level directory name is not stable across releases.
          root=$(find odin-dist -maxdepth 2 -name odin.exe -printf '%h\n' | head -1)
          echo "$(cygpath -w "$root")" >> "$GITHUB_PATH"

      - name: Shaders
        run: ./build-shaders.sh

      - name: Dependencies
        run: ./download-deps.sh

      # Static SDL3 pulls in the Win32 libraries it wraps. A shared build would
      # carry them itself; linked by hand, they have to be named. The list is
      # SDL's own, from sdl_link_dependency(base ...) in its CMakeLists.
      - name: Build
        run: |
          odin build src/app -o:speed -out:build/dirtbench.exe \
            -define:DIRTBENCH_VERSION="${{ inputs.version || 'dev' }}" \
            -define:DIRTBENCH_COMMIT="${GITHUB_SHA::7}" \
            -extra-linker-flags:"/LIBPATH:$(cygpath -w "$PWD/vendor/sdl3") /LIBPATH:$(cygpath -w "$PWD/vendor/imgui") /LIBPATH:$(cygpath -w "$PWD/vendor/delaunay") kernel32.lib user32.lib gdi32.lib winmm.lib imm32.lib ole32.lib oleaut32.lib version.lib uuid.lib advapi32.lib setupapi.lib shell32.lib"
          # Odin's -out: does not put the binary where it is asked to on this
          # platform. Settle it on one name rather than teaching three later
          # steps where to look, and say what was found either way.
          ls -la build/ || true
          if [ ! -f build/dirtbench.exe ]; then
            found=$(find . -maxdepth 3 -name 'dirtbench*.exe' -print -quit)
            [ -n "$found" ] || { echo "::error::odin produced no exe"; find . -maxdepth 3 -name '*.exe'; exit 1; }
            echo "odin wrote it to $found"
            mkdir -p build && mv "$found" build/dirtbench.exe
          fi

      - name: Check it runs
        run: |
          ./build/dirtbench.exe --version
          ./build/dirtbench.exe --notice | head -3

      # What the binary embeds, beside it, so a download carries its notices.
      - name: Stage the artifact
        run: |
          dir=dirtbench-${{ inputs.version || 'dev' }}-windows-x86_64
          mkdir -p "$dir"
          cp build/dirtbench.exe LICENSE credits.txt README.md "$dir/"
          7z a "$dir.zip" "$dir" > /dev/null
          sha256sum "$dir.zip" > "$dir.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dirtbench-${{ inputs.version || 'dev' }}-windows-x86_64.zip
            dirtbench-${{ inputs.version || 'dev' }}-windows-x86_64.zip.sha256
