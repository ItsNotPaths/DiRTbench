name: release

# Launched by ./release.sh --public --version <x.y.z> --notes <text>, which
# checks that the version matches src/app/notice.odin and that HEAD is pushed.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, without the leading v"
        required: true
      notes:
        description: "Release notes"
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The build image cannot run glslc: it needs glibc 2.38 and the image is
      # 2.28. SPIR-V is host-independent, so the shaders are built out here.
      - name: Install glslc
        run: sudo apt-get update && sudo apt-get install -y glslc

      - name: Build shaders
        run: ./build-shaders.sh

      # SDL takes minutes to compile and nothing about it changes between
      # releases, so the vendor directory is cached on the dep scripts.
      - name: Cache vendor
        uses: actions/cache@v4
        with:
          path: vendor-alma8
          key: vendor-alma8-${{ hashFiles('download-deps.sh', 'csrc/*.cpp') }}

      - name: Build image
        run: docker build -t dirtbench-build docker

      - name: Build
        run: |
          mkdir -p build vendor-alma8
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD":/src -v "$PWD/vendor-alma8":/src/vendor \
            -e HOME=/tmp \
            -e DIRTBENCH_VERSION="${{ inputs.version }}" \
            -e DIRTBENCH_COMMIT="${GITHUB_SHA::7}" \
            dirtbench-build -c '
              set -euo pipefail
              cd /src
              ./download-deps.sh
              CXX_RUNTIME="$(c++ -print-file-name=libstdc++.a)"
              GCC_RUNTIME="$(cc -print-libgcc-file-name)"
              GCC_EH_RUNTIME="$(cc -print-file-name=libgcc_eh.a)"
              odin build src/app -o:speed -out:build/dirtbench \
                -define:DIRTBENCH_VERSION="$DIRTBENCH_VERSION" \
                -define:DIRTBENCH_COMMIT="$DIRTBENCH_COMMIT" \
                -extra-linker-flags:"-L/src/vendor/sdl3 $CXX_RUNTIME $GCC_RUNTIME $GCC_EH_RUNTIME"
              strip --strip-all build/dirtbench
            '

      # A binary asking for a symbol version the image cannot have means the
      # link happened outside it. That binary starts on the runner and nowhere
      # a user is, so it must not become a release.
      - name: Check the glibc floor
        run: |
          floor=$(objdump -T build/dirtbench | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "glibc floor: $floor"
          case "$floor" in
            GLIBC_2.[0-9]|GLIBC_2.[12][0-9]) ;;
            *) echo "::error::floor is $floor; the link did not happen in the image"; exit 1 ;;
          esac

      # The stamp is the whole point: a binary that cannot say which commit it
      # came from is not worth publishing.
      - name: Check what it says it is
        run: |
          ./build/dirtbench --version
          want="dirtbench ${{ inputs.version }} (${GITHUB_SHA::7})"
          got=$(./build/dirtbench --version)
          [ "$got" = "$want" ] || { echo "::error::got '$got', wanted '$want'"; exit 1; }

      # The release asset is the binary itself, under a name that says which
      # platform it is for. No archive: there is one file, and unpacking it to
      # get one file is a step for nothing. No checksum either — the release
      # page prints a digest beside every asset. The licence, the credits and
      # the README are compiled in; see src/app/notice.odin.
      - name: Name the artifact
        run: mv build/dirtbench dirtbench-${{ inputs.version }}-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dirtbench-${{ inputs.version }}-linux-x86_64

  # One definition of the Windows build, in windows.yml, called from here.
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ inputs.version }}

  # Nothing is published until both platforms have built. A release that went
  # out with half of what it promised is the whole reason this job exists.
  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: What is being published
        run: ls -la dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "dirtbench ${{ inputs.version }}" \
            --notes "${{ inputs.notes }}" \
            --target "$GITHUB_SHA" \
            dist/*
